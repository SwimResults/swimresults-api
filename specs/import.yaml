components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (realm swimresults, RS256).
    serviceKey:
      type: apiKey
      in: header
      name: X-Swimresults-Service
      description: Shared service-to-service key; bypasses permission checks. Internal use only.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID (hex)
    ImportFileRequest:
      type: object
      properties:
        url:
          type: string
        text:
          type: string
        file_extension:
          type: string
        file_type:
          type: string
        exclude_events:
          type: array
          items:
            type: integer
          nullable: true
        include_events:
          type: array
          items:
            type: integer
          nullable: true
        meeting:
          type: string
        session_id:
          type: string
          x-go-name: SessionID
        features:
          type: array
          items:
            type: string
          nullable: true
      required:
        - url
        - text
        - file_extension
        - file_type
        - exclude_events
        - include_events
        - meeting
        - session_id
        - features
    ImportCertificatesRequestDto:
      type: object
      properties:
        directory:
          type: string
        meeting:
          type: string
      required:
        - directory
        - meeting
    ImportSetting:
      type: object
      properties:
        _id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          x-go-name: Identifier
        meeting:
          type: string
        pdf_start_list_settings:
          $ref: '#/components/schemas/ImportPdfStartListSettings'
        pdf_result_list_settings:
          $ref: '#/components/schemas/ImportPdfResultListSettings'
        certificate_settings:
          $ref: '#/components/schemas/ImportCertificateSettings'
        time_zone:
          type: string
      required:
        - _id
        - pdf_start_list_settings
        - pdf_result_list_settings
        - certificate_settings
    ImportPdfStartListSettings:
      type: object
      properties:
        omit_first:
          type: array
          items:
            type: string
          nullable: true
        event_separator:
          type: string
        event_skip_strings:
          type: array
          items:
            type: string
          nullable: true
        event_required_strings:
          type: array
          items:
            type: string
          nullable: true
        event_number_separator:
          type: string
        distance_separator:
          type: string
        gender_mapping:
          type: array
          items:
            type: array
            items:
              type: string
        style_name_skip_strings:
          type: array
          items:
            type: string
          nullable: true
        heat_separator:
          type: string
        heat_skip_strings:
          type: array
          items:
            type: string
          nullable: true
        heat_required_strings:
