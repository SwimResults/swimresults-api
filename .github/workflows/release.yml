# Release: push a tag vX.Y.Z on master. One version for all packages.
#   Go     github.com/swimresults/swimresults-api/go/<svc>api@vX.Y.Z   (the tag itself)
#   Swift  SwiftPM package at the repo root, from: "X.Y.Z"           (the tag itself)
#   npm    @swimresults/api@X.Y.Z                                   (published here, trusted publishing + provenance)
#   Maven  de.swimresults:swimresults-api:X.Y.Z                     (published here to Maven Central)
# npm/Maven jobs only run once the repo variables NPM_PUBLISH / MAVEN_PUBLISH are 'true' (see README "Publishing setup").
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # publish an existing tag to npm/Maven again (e.g. after enabling a registry); skips the GitHub release
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag, e.g. v0.1.0"
        required: true

permissions:
  contents: read
  actions: read # verify: check the CI run of the tagged commit

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Tag exists
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}" "refs/tags/$tag" >/dev/null \
            || { echo "::error::tag $tag does not exist. Create it first: git tag -a $tag -m $tag && git push origin $tag"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "::error::tag $tag does not exist"; exit 1; }
          v="${tag#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" --jq '.total_count')
          [ "$ok" -gt 0 ] || { echo "::error::no successful CI run (ci.yml) for $sha. Wait for CI to pass before tagging."; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - name: Generated Go code matches specs
        run: make generate-go && git diff --exit-code -- go/

  npm:
    needs: verify
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2 # trusted publishing needs npm >= 11.5.1
      - working-directory: typescript
        run: |
          if npm view "@swimresults/api@${{ needs.verify.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::@swimresults/api@${{ needs.verify.outputs.version }} is already on npm, skipping"; exit 0
          fi
          npm ci --no-audit --no-fund
          npm version "${{ needs.verify.outputs.version }}" --no-git-tag-version
          npm run build && npm test
          npm publish --access public --provenance

  maven:
    needs: verify
    if: ${{ vars.MAVEN_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Publish to Maven Central
        working-directory: kotlin
        run: |
          v="${{ needs.verify.outputs.version }}"
          if curl -sfI "https://repo1.maven.org/maven2/de/swimresults/swimresults-api/$v/swimresults-api-$v.pom" >/dev/null; then
            echo "::notice::de.swimresults:swimresults-api:$v is already on Maven Central, skipping"; exit 0
          fi
          ./gradlew publishToMavenCentral --no-daemon -PVERSION_NAME="$v"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  github-release:
    needs: verify
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
