components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (realm swimresults, RS256).
    serviceKey:
      type: apiKey
      in: header
      name: X-Swimresults-Service
      description: Shared service-to-service key; bypasses permission checks. Internal use only.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID (hex)
    Athlete:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        alias:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        year:
          type: integer
          format: int64
        gender:
          type: string
        dsv_id:
          type: integer
          format: int64
        team:
          $ref: '#/components/schemas/Team'
        first_meeting:
          type: string
        participation:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - _id
        - team
    Team:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        alias:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
        country:
          type: string
        dsv_id:
          type: integer
          format: int64
        state_id:
          type: integer
          format: int64
        address:
          $ref: '#/components/schemas/Address'
        contact:
          $ref: '#/components/schemas/Contact'
        website:
          type: string
        logo_url:
          type: string
        color_set:
          $ref: '#/components/schemas/ColorSet'
        first_meeting:
          type: string
        participation:
          oneOf:
            - type: array
              items:
                type: string
            - type: "null"
      required:
        - _id
        - address
        - contact
        - color_set
    Address:
      type: object
      properties:
        street:
          type: string
        number:
          type: string
        city:
          type: string
        postal_code:
          type: string
    Contact:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        fax:
          type: string
    ColorSet:
      type: object
      properties:
        primary:
          type: string
        secondary:
          type: string
        contrast:
          type: string
    ImportAthleteRequestDto:
      type: object
      properties:
        meeting:
          type: string
        athlete:
          $ref: '#/components/schemas/Athlete'
      required:
        - meeting
        - athlete
    AddParticipationRequestDto:
      type: object
      properties:
        athlete:
          $ref: '#/components/schemas/ObjectId'
        meeting:
          type: string
      required:
        - athlete
    AthleteIdList:
      type: object
      properties:
        athletes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            - type: "null"
      required:
        - athletes
    Certificate:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        athlete_id:
          $ref: '#/components/schemas/ObjectId'
        meeting:
          type: string
        path:
          type: string
        url:
          type: string
        hidden:
          type: boolean
        downloads:
          type: integer
          format: int64
        ordering:
          type: integer
          format: int64
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - athlete_id
        - added_at
        - updated_at
    ImportCertificateRequestDto:
      type: object
      properties:
        name:
          type: string
        meeting:
          type: string
        athlete_id:
          $ref: '#/components/schemas/ObjectId'
        path:
          type: string
      required:
        - name
        - meeting
        - athlete_id
        - path
    ImportTeamRequestDto:
      type: object
      properties:
        meeting:
          type: string
        team:
          $ref: '#/components/schemas/Team'
      required:
        - meeting
        - team
