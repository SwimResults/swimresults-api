components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (realm swimresults, RS256).
    serviceKey:
      type: apiKey
      in: header
      name: X-Swimresults-Service
      description: Shared service-to-service key; bypasses permission checks. Internal use only.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID (hex)
    AgeGroup:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        meeting:
          type: string
        event:
          type: integer
        default:
          type: boolean
        gender:
          type: string
        min_age:
          type: string
        max_age:
          type: string
        ages:
          type: array
          items:
            type: integer
          nullable: true
        is_year:
          type: boolean
        name:
          type: string
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - added_at
        - updated_at
    ImportAgeGroupRequestDto:
      type: object
      properties:
        age_group:
          $ref: '#/components/schemas/AgeGroup'
      required:
        - age_group
    Event:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        number:
          type: integer
        distance:
          type: integer
        relay_distance:
          type: string
        meeting:
          type: string
        gender:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        final:
          $ref: '#/components/schemas/EventFinal'
        part:
          $ref: '#/components/schemas/MeetingPart'
        name_extension:
          type: string
        finished:
          type: boolean
        certified:
          type: boolean
        no_start_list:
          type: boolean
        ordering:
          type: integer
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - style
        - final
        - part
        - added_at
        - updated_at
    Style:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
          nullable: true
        relay:
          type: boolean
      required:
        - _id
    EventFinal:
      type: object
      properties:
        is_prelim:
          type: boolean
        is_final:
          type: boolean
        name:
          type: string
    MeetingPart:
      type: object
      properties:
        number:
          type: integer
        name:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          nullable: true
    EventLivetimingDto:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/Event'
        prev_event:
          $ref: '#/components/schemas/Event'
        next_event:
          $ref: '#/components/schemas/Event'
      required:
        - event
        - prev_event
        - next_event
    ImportEventRequestDto:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/Event'
        style_name:
          type: string
        part_number:
          type: integer
          x-go-name: MeetingPartNumber
      required:
        - event
        - style_name
        - part_number
    EventCertificationRequestDto:
      type: object
      properties:
        certified:
          type: boolean
        toggle_certification:
          type: boolean
    StorageFile:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        meeting:
          type: string
        path:
          type: string
        url:
          type: string
        name:
          type: string
        extension:
          type: string
        in_file_list:
          type: boolean
        hidden:
          type: boolean
        existing:
          type: boolean
        downloads:
          type: integer
        ordering:
          type: integer
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - added_at
        - updated_at
    Incident:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        meeting:
          type: string
        type:
          type: string
        name:
          type: string
        name_extension:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        prev_event:
          type: integer
        next_event:
          type: integer
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - start
        - end
        - added_at
        - updated_at
    IncidentDateRequest:
      type: object
      properties:
        time:
          type: string
          format: date-time
        update_time_zone:
          type: boolean
      required:
        - time
        - update_time_zone
    Location:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        street:
          type: string
        number:
          type: string
        city:
          type: string
        postal_code:
          type: string
        name:
          type: string
        lanes:
          type: integer
        first_lane:
          type: integer
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - added_at
        - updated_at
    Meeting:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        date_start:
          type: string
          format: date-time
        date_end:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
