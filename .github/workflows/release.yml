# Release: push a tag vX.Y.Z on master. One version for all packages.
#   Go     github.com/swimresults/swimresults-api/go/<svc>api@vX.Y.Z   (the tag itself)
#   Swift  SwiftPM package at the repo root, from: "X.Y.Z"           (the tag itself)
#   npm    @swimresults/api@X.Y.Z                                   (published here, trusted publishing + provenance)
#   Maven  de.swimresults:swimresults-api:X.Y.Z                     (published here to Maven Central)
# npm/Maven jobs only run once the repo variables NPM_PUBLISH / MAVEN_PUBLISH are 'true' (see README "Publishing setup").
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must be vX.Y.Z"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/go.mod
      - name: Generated Go code matches specs
        run: make generate-go && git diff --exit-code -- go/

  npm:
    needs: verify
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.6.2 # trusted publishing needs npm >= 11.5.1
      - working-directory: typescript
        run: |
          npm ci --no-audit --no-fund
          npm version "${{ needs.verify.outputs.version }}" --no-git-tag-version
          npm run build && npm test
          npm publish --access public --provenance
        env:
          # Only needed for the very first publish (before the trusted publisher exists); remove afterwards.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  maven:
    needs: verify
    if: ${{ vars.MAVEN_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Publish to Maven Central
        working-directory: kotlin
        run: ./gradlew publishToMavenCentral --no-daemon -PVERSION_NAME=${{ needs.verify.outputs.version }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
