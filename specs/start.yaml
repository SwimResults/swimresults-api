components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (realm swimresults, RS256).
    serviceKey:
      type: apiKey
      in: header
      name: X-Swimresults-Service
      description: Shared service-to-service key; bypasses permission checks. Internal use only.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID (hex)
    ImportDisqualificationRequestDto:
      type: object
      properties:
        disqualification:
          $ref: '#/components/schemas/Disqualification'
        start:
          $ref: '#/components/schemas/Start'
      required:
        - disqualification
        - start
    Disqualification:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        type:
          type: string
        reason:
          type: string
        announcement_time:
          type: string
          format: date-time
        added_at:
          type: string
          format: date-time
      required:
        - _id
        - announcement_time
        - added_at
    Start:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: MongoDB ObjectID (hex)
          x-go-name: Identifier
        meeting:
          type: string
        event:
          type: integer
        heat_number:
          type: integer
        heat:
          $ref: '#/components/schemas/Heat'
        lane:
          type: integer
        is_relay:
          type: boolean
        is_pre_list:
          type: boolean
        athlete:
          $ref: '#/components/schemas/ObjectId'
        athlete_meeting_id:
          type: integer
        athlete_name:
          type: string
        athlete_alias:
          type: string
        athlete_year:
          type: integer
        athlete_team:
          $ref: '#/components/schemas/ObjectId'
        athlete_team_name:
          type: string
        rank:
          type: integer
        points:
          type: integer
        certified:
          type: boolean
        results:
          type: array
          items:
            $ref: '#/components/schemas/Result'
          nullable: true
        ranks:
          type: array
          items:
            $ref: '#/components/schemas/Rank'
          nullable: true
        disqualification:
          $ref: '#/components/schemas/Disqualification'
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - heat_number
        - heat
        - athlete
        - athlete_team
        - disqualification
        - added_at
        - updated_at
    Heat:
      type: object
      properties:
        _id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
