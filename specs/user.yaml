components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token (realm swimresults, RS256).
    serviceKey:
      type: apiKey
      in: header
      name: X-Swimresults-Service
      description: Shared service-to-service key; bypasses permission checks. Internal use only.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID (hex)
    Config:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        meeting:
          type: string
        enabled:
          type: boolean
      required:
        - _id
        - enabled
    Dashboard:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        widget_container:
          type: array
          items:
            $ref: '#/components/schemas/WidgetContainer'
          nullable: true
        user:
          type: string
        official:
          type: boolean
        default:
          type: boolean
        meeting_states:
          type: array
          items:
            type: string
          nullable: true
        meeting:
          type: string
      required:
        - _id
    WidgetContainer:
      type: object
      properties:
        order_position:
          type: integer
          format: int64
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/WidgetTile'
          nullable: true
    WidgetTile:
      type: object
      properties:
        widget:
          $ref: '#/components/schemas/Widget'
        data: {}
        order_position:
          type: integer
          format: int64
      required:
        - widget
    Widget:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        size:
          type: string
        content:
          type: string
      required:
        - _id
    NotificationRequestDto:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
        message:
          type: string
        interruption_level:
          type: string
      required:
        - title
        - subtitle
        - message
        - interruption_level
    NotificationResponseDto:
      type: object
      properties:
        apns_id:
          type: string
        body:
          type: string
      required:
        - apns_id
        - body
    MeetingNotificationRequestDto:
      type: object
      properties:
        subtitle:
          type: string
        message:
          type: string
        message_type:
          type: string
        interruption_level:
          type: string
      required:
        - subtitle
        - message
        - message_type
        - interruption_level
    NotificationsResponseDto:
      type: object
      properties:
        user_count:
          type: integer
          format: int64
        notification_user_count:
          type: integer
          format: int64
        success_count:
          type: integer
          format: int64
      required:
        - user_count
        - notification_user_count
        - success_count
    BroadcastResponseDto:
      type: object
      properties:
        apns_request_id:
          type: string
        apns_unique_id:
          type: string
        body:
          type: string
      required:
        - apns_request_id
        - apns_unique_id
        - body
    NotificationUser:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        user_id:
          $ref: '#/components/schemas/ObjectId'
        token:
          type: string
        settings:
          $ref: '#/components/schemas/NotificationSettings'
        device:
          $ref: '#/components/schemas/Device'
        push_service:
          type: string
        added_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - _id
        - user_id
        - token
        - settings
        - device
        - push_service
        - added_at
        - updated_at
    NotificationSettings:
      type: object
      properties:
        athlete:
          type: boolean
        favourites:
          type: boolean
        meeting:
          type: boolean
        schedule:
          type: boolean
      required:
        - athlete
        - favourites
        - meeting
        - schedule
    Device:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        localized_model:
          type: string
        system_name:
          type: string
        system_version:
          type: string
        type:
          type: string
        ui_size:
          type: string
        language:
          type: string
        app_version:
          type: string
      required:
        - name
        - model
        - localized_model
        - system_name
        - system_version
        - type
        - ui_size
        - language
        - app_version
    RegisterNotificationUserRequestDto:
      type: object
      properties:
        token:
          type: string
        device:
          $ref: '#/components/schemas/Device'
        settings:
          $ref: '#/components/schemas/NotificationSettings'
        push_service:
          type: string
      required:
        - device
        - settings
    UserReport:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        message:
          type: string
        meeting:
          type: string
        user_id:
          $ref: '#/components/schemas/ObjectId'
        subject_id:
          $ref: '#/components/schemas/ObjectId'
        subject_type:
          $ref: '#/components/schemas/ReportSubjectType'
        acknowledged:
          type: boolean
        completed:
          type: boolean
        added_at:
          type: string
          format: date-time
      required:
        - _id
        - message
        - user_id
        - subject_id
        - acknowledged
        - completed
        - added_at
    ReportSubjectType:
      type: string
      enum:
        - ATHLETE
        - EVENT
        - HEAT
        - MEETING
        - START
        - TEAM
    UserReportSubmission:
      type: object
      properties:
        message:
          type: string
        anonymous:
          type: boolean
        meeting:
          type: string
        subject_id:
          $ref: '#/components/schemas/ObjectId'
        subject_type:
          $ref: '#/components/schemas/ReportSubjectType'
      required:
        - message
        - subject_id
    User:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/ObjectId'
        keycloak_id:
          type: string
        following:
          type: array
          items:
            $ref: '#/components/schemas/FollowingAthlete'
          nullable: true
        own_athlete_id:
          type: string
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        settings:
          $ref: '#/components/schemas/Settings'
        meetings:
          type: array
          items:
            type: string
          nullable: true
      required:
        - _id
        - settings
    FollowingAthlete:
      type: object
      properties:
        athlete_id:
          $ref: '#/components/schemas/ObjectId'
        added_at:
          type: string
          format: date-time
      required:
        - athlete_id
        - added_at
    Settings:
      type: object
      properties:
        language:
          type: string
        theme:
          type: string
    FollowAthleteRequestDto:
      type: object
      properties:
        athlete:
          $ref: '#/components/schemas/ObjectId'
        follow:
          type: boolean
      required:
        - athlete
    SubscribeMeetingRequestDto:
      type: object
      properties:
        meeting:
          type: string
        subscribe:
          type: boolean
      required:
        - meeting
    SetMeRequestDto:
      type: object
      properties:
        athlete:
          $ref: '#/components/schemas/ObjectId'
        set:
          type: boolean
      required:
        - athlete
    SetLanguageRequestDto:
      type: object
      properties:
        language:
          type: string
    SetThemeRequestDto:
      type: object
      properties:
        theme:
          type: string
